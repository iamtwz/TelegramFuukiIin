[workspace]
members = ["apps/bot", "packages/verification-protocol"]
resolver = "3"

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/iamtwz/TelegramFuukiIin"

[workspace.dependencies]
tokio = { version = "=1.53.1", default-features = false, features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
uuid = { version = "=1.26.1", features = ["v4"] }
clap = { version = "=4.6.7", features = ["derive"] }
thiserror = "=2.0.21"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = "symbols"

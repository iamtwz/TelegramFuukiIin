<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>TelegramFuukiIin Verify</title>
  <link rel="stylesheet" href="/style.css">
  <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main class="verification" aria-labelledby="title">
    <div class="verification-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="8.5" cy="7.5" r="3"/><circle cx="17" cy="8.5" r="2.5"/><path d="M2.5 20v-2a6 6 0 0 1 12 0v2M17 14a4.5 4.5 0 0 1 4.5 4.5V20"/></svg></div>
    <h1 id="title"></h1>
    <p id="status" role="status" aria-live="polite" aria-atomic="true"></p>
    <div class="challenge-shell">
      <div id="challenge-loading" aria-hidden="true" hidden><span class="loading-indicator"></span></div>
      <div id="challenge"></div>
    </div>
    <button id="retry" type="button" hidden></button>
    <button id="close" type="button" hidden></button>
    <noscript><p>JavaScript is required · 请启用 JavaScript</p></noscript>
  </main>
  <footer class="page-footer">
    <div class="language-control">
      <button id="language" class="language-trigger" type="button" aria-label="Language" aria-haspopup="listbox" aria-expanded="false" aria-controls="language-options">
        <svg class="globe" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c5 5 5 13 0 18-5-5-5-13 0-18Z"/></svg>
        <span id="language-label">English</span>
        <svg class="chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg>
      </button>
      <ul id="language-options" class="language-menu" role="listbox" aria-label="Language" hidden>
        <li role="option" data-locale="en" tabindex="-1" aria-selected="true"><span lang="en">English</span><span class="selected-mark" aria-hidden="true">✓</span></li>
        <li role="option" data-locale="zh-Hans" tabindex="-1" aria-selected="false"><span lang="zh-Hans">简体中文</span><span class="selected-mark" aria-hidden="true">✓</span></li>
        <li role="option" data-locale="zh-Hant" tabindex="-1" aria-selected="false"><span lang="zh-Hant">繁體中文</span><span class="selected-mark" aria-hidden="true">✓</span></li>
      </ul>
    </div>
  </footer>
</body>
</html>
